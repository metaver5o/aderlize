server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page static site
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for the fabric samples if you add a tecidos/ folder
    location /tecidos/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
